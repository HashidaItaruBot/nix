# ⚠️ 参考文件（reference only）
#
# 本仓库对 MaiBot 的实际部署是声明式的 Nix 模块：home/podman/maibot.nix
# （基于 home-manager podman quadlet：services.podman.networks / .containers）。
#
# 这份文件改编自上游官方 docker-compose.yml（MaiBot 仓库 main 分支），仅用于：
#   - 对照 nix 模块与官方编排的差异
#   - 如果未来想在非 Nix 环境临时复现部署，可拿走使用
#
# 上游：https://github.com/Mai-with-u/MaiBot/blob/main/docker-compose.yml
# 官方 Docker 部署文档：https://docs.mai-mai.org/manual/deployment/docker

services:
  core:
    container_name: maibot-core
    stop_grace_period: 70s # Runner 最多等待 Worker 60 秒，再保留强制退出时间
    image: sengokucola/maibot:latest
    environment:
      - TZ=Asia/Shanghai
      - EULA_AGREE=8e6e7d647f7f82d6ea98456b73908656
      - PRIVACY_AGREE=91e5db7659c560bc3545e63859b6ebc0
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html
      - HTTP_HOST=0.0.0.0
    ports:
      - "18001:8001" # WebUI
    volumes:
      - ./docker-config/mmc:/MaiMBot/config
      - ./data/MaiMBot:/MaiMBot/data
      - ./data/MaiMBot-plugin-data:/MaiMBot/data/plugins
      - ./data/MaiMBot/emoji:/data/emoji
      - ./data/MaiMBot/plugins:/MaiMBot/plugins
      - ./data/MaiMBot/logs:/MaiMBot/logs
      # - ./depends-data:/MaiMBot/depends-data # 官方 compose 挂载仓库的 depends-data，nix/镜像部署不需要
    restart: always
    networks:
      - maibot

  napcat:
    container_name: maibot-napcat
    image: mlikiowa/napcat-docker:latest
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099" # NapCat WebUI（扫码登录）
    volumes:
      - ./docker-config/napcat:/app/napcat/config
      - ./data/qq:/app/.config/QQ
      - ./data/MaiMBot:/MaiMBot/data
    restart: always
    networks:
      - maibot
    aliases:
      - napcat

  # 可选：SQLite 数据库 Web 查看器（查看麦麦记忆/数据）
  # 注意：coleifer/sqlite-web 镜像不支持 arm64
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: maibot-sqlite-web
    restart: always
    ports:
      - "8120:8080"
    volumes:
      - ./data/MaiMBot:/data/MaiMBot
    environment:
      - SQLITE_DATABASE=MaiMBot/MaiBot.db
    networks:
      - maibot

networks:
  maibot:
    driver: bridge
