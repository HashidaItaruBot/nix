# OpenHands LLM API 密钥
# 加密方法：sops --encrypt --age $(cat ~/.config/sops/age/keys.txt | grep -oP 'age1.*' | head -1) nixos/secrets/openhands.yaml > nixos/secrets/openhands.enc.yaml && mv nixos/secrets/openhands.enc.yaml nixos/secrets/openhands.yaml
#
# 重要：密钥文件格式必须是 EnvironmentFile 兼容格式
# systemd EnvironmentFile 读取格式：KEY=value
LLM_API_KEY: "your-aliyun-bailian-api-key-here"