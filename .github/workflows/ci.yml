name: Nix CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        host: [b850m, hades]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          # Remove preinstalled toolchains we don't need (~25 GB total)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghc /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Keep as much room as possible for the store while building
            min-free = 5368709120
            max-free = 10737418240

      - name: Check flake metadata
        run: nix flake metadata

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
