name: Nix CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting (alejandra)
        run: nix fmt . -- --check

  build:
    strategy:
      matrix:
        host: [b850m, hades]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        continue-on-error: true
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          # Remove preinstalled toolchains we don't need (~25 GB total)
          timeout 600 sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghc /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          # Guard against a hung Docker daemon
          timeout 300 sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Keep as much room as possible for the store while building
            min-free = 5368709120
            max-free = 10737418240
            # NOTE: intentionally no keep-outputs / keep-env-derivations here.
            # They root the whole build graph (~75 GB), so GC could not shrink
            # the store and every cache save was a ~26 GB tar — far over the
            # 10 GB Actions cache quota, making saves evict each other. Leave
            # them off so gc-max-store-size below can trim the store down to
            # the runtime closure and both hosts' caches fit side by side.

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # New cache per flake.lock change; job-scoped
          primary-key: nix-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('**/flake.lock') }}
          # Fall back to this host's older cache, then any host's (shared base)
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.host }}-
            nix-${{ runner.os }}-
          # Stay under the 10 GB Actions cache limit
          gc-max-store-size-linux: 8G
          # Drop caches not used for a week
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Check flake metadata
        run: nix flake metadata

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Diagnose store and GC to the real cache target
        # The action's gc-max is broken: it passes storeSize - gcMax to
        # `nix store gc --max`, but --max is a target size, not
        # bytes-to-free (collectGarbage.ts), so GC aimed at ~67 GB and the
        # cache stayed a ~19 GB tar. GC ourselves to the 8 GiB target.
        run: |
          RES=$(readlink -f result)
          echo "toplevel: $RES"
          echo "-- indirect GC roots:"
          ls -l /nix/var/nix/gcroots/auto/ || true
          echo "-- store before gc (bytes):"
          nix path-info --all --json --json-format 2 | jq '[.info[].narSize] | add' || true
          echo "-- toplevel closure size:"
          nix path-info -S "$RES" || true
          nix store gc --max 8589934592
          echo "-- store after gc (bytes):"
          nix path-info --all --json --json-format 2 | jq '[.info[].narSize] | add' || true
          echo "-- biggest toplevel closure entries (bytes, path):"
          nix path-info -r --json --json-format 2 "$RES" | jq -r '.info | map([.narSize, (.path // .storePath // .name // "?"))] | sort_by(.[0]) | reverse | .[:15][] | "\(.[0]) \(.[1])"' || true
          echo "-- closure entry count:"
          nix path-info -r "$RES" | wc -l || true
