name: Nix CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        host: [b850m, hades]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        continue-on-error: true
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          # Remove preinstalled toolchains we don't need (~25 GB total)
          timeout 600 sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghc /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          # Guard against a hung Docker daemon
          timeout 300 sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Keep as much room as possible for the store while building
            min-free = 5368709120
            max-free = 10737418240
            # Retain closures so the cache keeps full dependency trees
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # New cache per flake.lock change; job-scoped
          primary-key: nix-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('**/flake.lock') }}
          # Fall back to this host's older cache, then any host's (shared base)
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ matrix.host }}-
            nix-${{ runner.os }}-
          # Stay under the 10 GB Actions cache limit
          gc-max-store-size-linux: 8G
          # Drop caches not used for a week
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Check flake metadata
        run: nix flake metadata

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
