name: Nix CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting (alejandra)
        run: nix fmt . -- --check

  build:
    strategy:
      matrix:
        host: [b850m, hades]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        continue-on-error: true
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          # Remove preinstalled toolchains we don't need (~25 GB total)
          timeout 600 sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghc /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          # Guard against a hung Docker daemon
          timeout 300 sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Keep as much room as possible for the store while building
            min-free = 5368709120
            max-free = 10737418240
            # CDN flakiness from GH runners (e.g. fetchurl of the QQ .deb,
            # curl(35) connection reset): retry more, fail faster per attempt
            download-attempts = 15
            connect-timeout = 15
            # NOTE: intentionally no keep-outputs / keep-env-derivations here.
            # They root the whole build graph (~75 GB), so GC could not shrink
            # the store and every cache save was a ~26 GB tar — far over the
            # 10 GB Actions cache quota, making saves evict each other. Leave
            # them off so gc-max-store-size below can trim the store down to
            # the runtime closure and both hosts' caches fit side by side.

      # Persistent binary cache (survives GHA cache eviction). Hosts
      # consume it declaratively via nix.settings in default.nix, so no
      # manual `cachix use` is needed. Pushes cover only paths
      # cache.nixos.org doesn't already serve.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: itsmyowninvention
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Check flake metadata
        run: nix flake metadata

      - name: Build ${{ matrix.host }}
        run: nix build --print-build-logs .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
